server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Frame-Options        DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy  "default-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws: wss:; img-src 'self' data:" always;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass             http://api:8000/api/;
        proxy_set_header       Host $host;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       Content-Type $content_type;
        proxy_pass_header      Content-Type;
        proxy_http_version     1.1;
        proxy_read_timeout     60s;
        proxy_buffering        off;
    }

    location /ws/live {
        proxy_pass         http://api:8000/ws/live;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }
}
